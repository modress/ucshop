<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KABAN UC SHOP</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0f1015;
            --card-bg: #181a20;
            --card-border: #2b2f3a;
            --accent-yellow: #ffb703;
            --accent-blue: #0088cc;
            --accent-green: #2ecc71;
            --text-main: #ffffff;
            --text-sub: #a0a5b5;
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 12px;
            padding-bottom: 90px;
        }

        .header {
            text-align: center;
            padding: 10px 0 15px;
        }

        .header h1 {
            margin: 0;
            font-size: 26px;
            font-weight: 800;
            background: linear-gradient(45deg, #ffb703, #ff8200);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Крупные переключатели разделов */
        .main-tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .main-tab-btn {
            background: var(--card-bg);
            border: 2px solid var(--card-border);
            border-radius: 14px;
            padding: 14px;
            text-align: center;
            font-size: 16px;
            font-weight: 700;
            color: var(--text-sub);
            cursor: pointer;
            transition: 0.2s;
        }

        .main-tab-btn.active-pubg {
            border-color: var(--accent-yellow);
            color: var(--accent-yellow);
            background: rgba(255, 183, 3, 0.1);
        }

        .main-tab-btn.active-tg {
            border-color: var(--accent-blue);
            color: var(--accent-blue);
            background: rgba(0, 136, 204, 0.1);
        }

        /* Сетка крупных карточек */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            text-align: center;
            position: relative;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .card-icon {
            font-size: 42px;
            margin-bottom: 8px;
        }

        .card-title {
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .card-price {
            font-size: 18px;
            font-weight: 800;
            color: var(--accent-green);
            margin-bottom: 12px;
        }

        .btn-buy {
            width: 100%;
            background: linear-gradient(180deg, #2ecc71, #27ae60);
            border: none;
            color: #000;
            padding: 10px 0;
            border-radius: 10px;
            font-weight: 800;
            font-size: 14px;
            cursor: pointer;
        }

        /* Модальное окно выбора оплаты */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            align-items: center;
            justify-content: center;
            z-index: 999;
            padding: 20px;
        }

        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            width: 100%;
            max-width: 350px;
            padding: 20px;
            text-align: center;
        }

        .pay-option {
            width: 100%;
            background: #232733;
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 10px;
            color: #fff;
            font-weight: 700;
            font-size: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
        }

        .pay-option.sbp { border-color: #00b0ff; }
        .pay-option.crypto { border-color: #f7931a; }
        .pay-option.stars { border-color: #ffb703; }

        .close-btn {
            background: none;
            border: none;
            color: var(--text-sub);
            font-size: 14px;
            margin-top: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🐗 KABAN SHOP</h1>
    </div>

    <!-- Вкладки PUBG / Telegram -->
    <div class="main-tabs">
        <div id="tab-pubg" class="main-tab-btn active-pubg" onclick="switchSection('pubg')">🎮 PUBG Mobile</div>
        <div id="tab-tg" class="main-tab-btn" onclick="switchSection('tg')">✈️ Telegram</div>
    </div>

    <!-- РАЗДЕЛ PUBG MOBILE -->
    <div id="sec-pubg" class="products-grid">
        <div class="card">
            <div class="card-icon">💵</div>
            <div class="card-title">60 UC</div>
            <div class="card-price">95 ₽</div>
            <button class="btn-buy" onclick="openPayModal('60 UC', 95)">Купить</button>
        </div>
        <div class="card">
            <div class="card-icon">💵</div>
            <div class="card-title">325 UC</div>
            <div class="card-price">480 ₽</div>
            <button class="btn-buy" onclick="openPayModal('325 UC', 480)">Купить</button>
        </div>
        <div class="card">
            <div class="card-icon">💰</div>
            <div class="card-title">660 UC</div>
            <div class="card-price">890 ₽</div>
            <button class="btn-buy" onclick="openPayModal('660 UC', 890)">Купить</button>
        </div>
        <div class="card">
            <div class="card-icon">👑</div>
            <div class="card-title">Prime Plus</div>
            <div class="card-price">990 ₽</div>
            <button class="btn-buy" onclick="openPayModal('PUBG Prime Plus', 990)">Купить</button>
        </div>
        <div class="card">
            <div class="card-icon">🎟</div>
            <div class="card-title">Код 60 UC</div>
            <div class="card-price">100 ₽</div>
            <button class="btn-buy" onclick="openPayModal('Код 60 UC', 100)">Купить</button>
        </div>
        <div class="card">
            <div class="card-icon">🎟</div>
            <div class="card-title">Код 325 UC</div>
            <div class="card-price">500 ₽</div>
            <button class="btn-buy" onclick="openPayModal('Код 325 UC', 500)">Купить</button>
        </div>
    </div>

    <!-- РАЗДЕЛ TELEGRAM -->
    <div id="sec-tg" class="products-grid" style="display: none;">
        <div class="card">
            <div class="card-icon">⭐️</div>
            <div class="card-title">50 Stars</div>
            <div class="card-price">120 ₽</div>
            <button class="btn-buy" onclick="openPayModal('50 Telegram Stars', 120)">Купить</button>
        </div>
        <div class="card">
            <div class="card-icon">⭐️</div>
            <div class="card-title">100 Stars</div>
            <div class="card-price">230 ₽</div>
            <button class="btn-buy" onclick="openPayModal('100 Telegram Stars', 230)">Купить</button>
        </div>
        <div class="card">
            <div class="card-icon">⭐</div>
            <div class="card-title">500 Stars</div>
            <div class="card-price">1100 ₽</div>
            <button class="btn-buy" onclick="openPayModal('500 Telegram Stars', 1100)">Купить</button>
        </div>
        <div class="card">
            <div class="card-icon">💎</div>
            <div class="card-title">Premium 3 мес</div>
            <div class="card-price">1490 ₽</div>
            <button class="btn-buy" onclick="openPayModal('TG Premium 3 мес', 1490)">Купить</button>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО ОПЛАТЫ -->
    <div id="payModal" class="modal">
        <div class="modal-content">
            <h3 id="modalTitle" style="margin-top:0;">Выберите способ оплаты</h3>
            <p id="modalSub" style="color:var(--text-sub); font-size:14px; margin-bottom:20px;"></p>

            <button class="pay-option sbp" onclick="submitOrder('sbp')">🏦 СБП (Система быстрых платежей)</button>
            <button class="pay-option crypto" onclick="submitOrder('crypto')">⚡️ Crypto Bot (USDT/TON)</button>
            <button class="pay-option stars" onclick="submitOrder('stars')">⭐️ Telegram Stars</button>

            <button class="close-btn" onclick="closePayModal()">Отмена</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let selectedItem = "";
        let selectedPrice = 0;

        function switchSection(sec) {
            document.getElementById('sec-pubg').style.display = sec === 'pubg' ? 'grid' : 'none';
            document.getElementById('sec-tg').style.display = sec === 'tg' ? 'grid' : 'none';

            document.getElementById('tab-pubg').className = 'main-tab-btn ' + (sec === 'pubg' ? 'active-pubg' : '');
            document.getElementById('tab-tg').className = 'main-tab-btn ' + (sec === 'tg' ? 'active-tg' : '');
        }

        function openPayModal(item, price) {
            selectedItem = item;
            selectedPrice = price;
            document.getElementById('modalTitle').innerText = item;
            document.getElementById('modalSub').innerText = `К оплате: ${price} ₽`;
            document.getElementById('payModal').style.display = 'flex';
        }

        function closePayModal() {
            document.getElementById('payModal').style.display = 'none';
        }

        function submitOrder(method) {
            // Передаем строку "НАЗВАНИЕ|ЦЕНА|МЕТОД" обратно в бота
            tg.sendData(`${selectedItem}|${selectedPrice}|${method}`);
            tg.close();
        }
    </script>
</body>
</html>
