<!DOCTYPE html>
<html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>UC Shop</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0d0f14;--card:#171a22;--line:#262b37;--txt:#f4f5f7;--dim:#8b92a3;--acc:#ff9f1a;--acc2:#ff5e3a}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,Segoe UI,Roboto,sans-serif;padding:16px 16px 110px}
.hero{border-radius:22px;padding:22px;margin-bottom:18px;background:linear-gradient(135deg,#ff9f1a,#ff5e3a 70%,#c1272d);position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.15)}
.hero h1{font-size:24px;font-weight:800}.hero p{opacity:.9;margin-top:4px;font-size:14px}
h2{font-size:13px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;margin:18px 4px 10px}
input{width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:14px;color:var(--txt);font-size:17px;padding:15px 16px;outline:none;transition:.2s}
input:focus{border-color:var(--acc)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pack{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:16px 14px;cursor:pointer;transition:.18s;position:relative}
.pack:active{transform:scale(.97)}
.pack.sel{border-color:var(--acc);background:linear-gradient(160deg,#2a2114,#171a22)}
.pack .uc{font-size:24px;font-weight:800}.pack .uc span{font-size:13px;color:var(--acc);margin-left:3px}
.pack .price{color:var(--dim);margin-top:6px;font-size:14px}
.tag{position:absolute;top:-8px;right:10px;background:linear-gradient(90deg,var(--acc),var(--acc2));color:#111;font-size:10px;font-weight:800;padding:3px 8px;border-radius:8px}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 35%)}
.btn{width:100%;border:0;border-radius:16px;padding:17px;font-size:17px;font-weight:800;color:#111;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:.2s}
.btn:disabled{opacity:.35}
.err{color:#ff6b6b;font-size:13px;margin:6px 4px 0;min-height:16px}
</style></head><body>
<div class="hero"><h1>🎮 PUBG Mobile UC</h1><p>Быстрое пополнение по ID · оплата звёздами</p></div>

<h2>Твой PUBG ID</h2>
<input id="pid" inputmode="numeric" maxlength="12" placeholder="Например 5123456789">
<div class="err" id="err"></div>

<h2>Выбери пак</h2>
<div class="grid" id="grid"></div>

<div class="bar"><button class="btn" id="buy" disabled>Выбери пак</button></div>

<script>
const tg=Telegram.WebApp;tg.ready();tg.expand();
tg.setHeaderColor('#0d0f14');tg.setBackgroundColor('#0d0f14');
// те же цены, что в uc_bot.py (реальная цена всё равно берётся на сервере)
const PACKS=[
 {id:"uc60",uc:60,rub:95},{id:"uc325",uc:325,rub:480},
 {id:"uc660",uc:660,rub:950,tag:"ХИТ"},{id:"uc1800",uc:1800,rub:2400},
 {id:"uc3850",uc:3850,rub:4800,tag:"ВЫГОДНО"},{id:"uc8100",uc:8100,rub:9500}];
let sel=null;
const grid=document.getElementById('grid'),buy=document.getElementById('buy'),pid=document.getElementById('pid'),err=document.getElementById('err');
PACKS.forEach(p=>{
 const d=document.createElement('div');d.className='pack';
 d.innerHTML=(p.tag?`<div class="tag">${p.tag}</div>`:'')+`<div class="uc">${p.uc}<span>UC</span></div><div class="price">${p.rub} ₽</div>`;
 d.onclick=()=>{sel=p;document.querySelectorAll('.pack').forEach(x=>x.classList.remove('sel'));d.classList.add('sel');tg.HapticFeedback.impactOccurred('light');upd()};
 grid.appendChild(d)});
function upd(){
 const ok=sel&&pid.value.length>=8;
 buy.disabled=!ok;
 buy.textContent=sel?`Оплатить ${sel.rub} ₽ · ${sel.uc} UC`:'Выбери пак';
}
pid.oninput=()=>{pid.value=pid.value.replace(/\D/g,'');err.textContent='';upd()};
buy.onclick=()=>{
 if(pid.value.length<8){err.textContent='Введи корректный ID (8–12 цифр)';return}
 tg.sendData(JSON.stringify({pack:sel.id,pubg_id:pid.value}));
};
</script></body></html>
