<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KABAN UC</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-green: #2ed573;
            --accent-blue: #1e90ff;
            --text-color: #ffffff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
        }

        .header {
            text-align: center;
            padding: 10px 0;
            border-bottom: 1px solid #333;
            margin-bottom: 15px;
        }

        .header h1 {
            margin: 0;
            color: var(--accent-green);
            font-size: 24px;
        }

        .nav-tabs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            margin-bottom: 15px;
            padding-bottom: 5px;
        }

        .tab-btn {
            background: var(--card-bg);
            color: #fff;
            border: 1px solid #333;
            padding: 8px 14px;
            border-radius: 8px;
            white-space: nowrap;
            cursor: pointer;
            font-weight: 500;
        }

        .tab-btn.active {
            background: var(--accent-green);
            color: #000;
            border-color: var(--accent-green);
        }

        .tab-btn.blue.active {
            background: var(--accent-blue);
            border-color: var(--accent-blue);
            color: #fff;
        }

        .section {
            display: none;
        }

        .section.active {
            display: block;
        }

        .item-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #2a2a2a;
        }

        .item-title {
            font-weight: bold;
            font-size: 16px;
        }

        .item-price {
            color: var(--accent-green);
            font-weight: bold;
        }

        .buy-btn {
            background: var(--accent-green);
            color: #000;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        .buy-btn.blue {
            background: var(--accent-blue);
            color: #fff;
        }

        .footer-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--card-bg);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            border-top: 1px solid #333;
        }

        .footer-btn {
            background: none;
            border: none;
            color: #888;
            font-size: 12px;
            cursor: pointer;
        }

        .footer-btn.active {
            color: var(--accent-green);
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🐗 KABAN UC</h1>
        <p style="margin: 5px 0 0; color: #888; font-size: 13px;">Добро пожаловать в магазин!</p>
    </div>

    <!-- Вкладки навигации -->
    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('uc')">Купить UC</button>
        <button class="tab-btn" onclick="switchTab('plus')">Plus Подписка</button>
        <button class="tab-btn" onclick="switchTab('code')">Код на UC</button>
        <button class="tab-btn blue" onclick="switchTab('stars')">Звёзды / Premium</button>
    </div>

    <!-- Разделы товаров -->
    <div id="sec-uc" class="section active">
        <div class="item-card">
            <div>
                <div class="item-title">60 UC</div>
                <div class="item-price">90 ₽</div>
            </div>
            <button class="buy-btn" onclick="buyItem('60 UC')">Купить</button>
        </div>
        <div class="item-card">
            <div>
                <div class="item-title">325 UC</div>
                <div class="item-price">450 ₽</div>
            </div>
            <button class="buy-btn" onclick="buyItem('325 UC')">Купить</button>
        </div>
        <div class="item-card">
            <div>
                <div class="item-title">660 UC</div>
                <div class="item-price">890 ₽</div>
            </div>
            <button class="buy-btn" onclick="buyItem('660 UC')">Купить</button>
        </div>
    </div>

    <div id="sec-plus" class="section">
        <div class="item-card">
            <div>
                <div class="item-title">PUBG Prime Plus (1 мес)</div>
                <div class="item-price">990 ₽</div>
            </div>
            <button class="buy-btn" onclick="buyItem('Prime Plus')">Купить</button>
        </div>
    </div>

    <div id="sec-code" class="section">
        <div class="item-card">
            <div>
                <div class="item-title">Промокод 60 UC</div>
                <div class="item-price">95 ₽</div>
            </div>
            <button class="buy-btn" onclick="buyItem('Код 60 UC')">Купить</button>
        </div>
    </div>

    <div id="sec-stars" class="section">
        <div class="item-card">
            <div>
                <div class="item-title">50 Telegram Stars</div>
                <div class="item-price">120 ₽</div>
            </div>
            <button class="buy-btn blue" onclick="buyItem('50 Stars')">Купить</button>
        </div>
        <div class="item-card">
            <div>
                <div class="item-title">Telegram Premium (3 мес)</div>
                <div class="item-price">1490 ₽</div>
            </div>
            <button class="buy-btn blue" onclick="buyItem('TG Premium 3M')">Купить</button>
        </div>
    </div>

    <!-- Профиль -->
    <div id="sec-profile" class="section">
        <div style="background: var(--card-bg); padding: 15px; border-radius: 12px;">
            <h3>Профиль</h3>
            <p id="user-info">Загрузка данных...</p>
        </div>
    </div>

    <!-- Поддержка -->
    <div id="sec-support" class="section">
        <div style="background: var(--card-bg); padding: 15px; border-radius: 12px; text-align: center;">
            <h3>Служба поддержки</h3>
            <p>По всем вопросам обращайтесь к нашему менеджеру:</p>
            <a href="https://t.me/neleron" style="color: var(--accent-green); font-weight: bold; font-size: 18px; text-decoration: none;">@neleron</a>
        </div>
    </div>

    <br><br><br>

    <!-- Нижняя панель -->
    <div class="footer-nav">
        <button class="footer-btn active" onclick="switchTab('uc')">🛒 Магазин</button>
        <button class="footer-btn" onclick="switchTab('profile')">👤 Профиль</button>
        <button class="footer-btn" onclick="switchTab('support')">👨‍💻 Поддержка</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); // Разворачивает Mini App на весь экран

        // Вывод профиля из Telegram API
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            const u = tg.initDataUnsafe.user;
            document.getElementById('user-info').innerHTML = `
                <b>Имя:</b> ${u.first_name}<br>
                <b>Username:</b> @${u.username || 'нет'}<br>
                <b>ID:</b> ${u.id}
            `;
        } else {
            document.getElementById('user-info').innerHTML = "Открыто вне Telegram";
        }

        function switchTab(tab) {
            document.querySelectorAll('.section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            
            if(tab === 'uc') {
                document.getElementById('sec-uc').classList.add('active');
            } else if(tab === 'plus') {
                document.getElementById('sec-plus').classList.add('active');
            } else if(tab === 'code') {
                document.getElementById('sec-code').classList.add('active');
            } else if(tab === 'stars') {
                document.getElementById('sec-stars').classList.add('active');
            } else if(tab === 'profile') {
                document.getElementById('sec-profile').classList.add('active');
            } else if(tab === 'support') {
                document.getElementById('sec-support').classList.add('active');
            }
        }

        function buyItem(itemName) {
            tg.sendData(JSON.stringify({action: "buy", item: itemName}));
            tg.close();
        }
    </script>
</body>
</html>
