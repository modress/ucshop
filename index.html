<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KABAN UC — Премиум Магазин</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#080506;
  --card:#140c0f;
  --card-hover:#1c1015;
  --line:#2e151a;
  --txt:#ffffff;
  --dim:#9e858a;
  --acc:#ff2d3d;
  --acc-glow:rgba(255, 45, 61, 0.35);
  --acc2:#b3121f;
  --green:#2ecc71;
  --yellow:#ffb703;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
  background:radial-gradient(1000px 500px at 50% -120px,#3f0a12,var(--bg) 65%) no-repeat,var(--bg);
  color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  padding:16px 16px 120px;
  min-height:100vh;
}
.scr{display:none;animation:in .25s ease-out}
.scr.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* Герой блок */
.hero{
  border-radius:24px;
  padding:28px 22px;
  margin-bottom:18px;
  background:linear-gradient(135deg,#ff2d3d,#c91827 60%,#7a0812);
  position:relative;
  overflow:hidden;
  box-shadow:0 14px 45px var(--acc-glow);
}
.hero:after{
  content:"🐗";
  position:absolute;
  right:-10px;
  bottom:-20px;
  font-size:110px;
  opacity:0.18;
}
.hero small{opacity:.9;font-size:13px;font-weight:600;letter-spacing:0.5px}
.hero h1{font-size:28px;font-weight:900;margin-top:4px;line-height:1.15;letter-spacing:-0.5px}
.hero p{opacity:.92;margin-top:8px;font-size:14px;line-height:1.4}

/* Большие карточки на главной */
.big-grid{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:16px}
.big{
  border-radius:20px;
  padding:20px;
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:16px;
  border:1.5px solid var(--line);
  background:var(--card);
  transition:all .2s cubic-bezier(0.4, 0, 0.2, 1);
  box-shadow:0 6px 20px rgba(0,0,0,0.4);
}
.big:active{transform:scale(0.97)}
.big:hover{border-color:var(--acc);background:var(--card-hover)}
.big .ic{
  font-size:36px;
  width:64px;
  height:64px;
  border-radius:20px;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,var(--acc),var(--acc2));
  box-shadow:0 8px 20px var(--acc-glow);
  flex-shrink:0;
}
.big b{font-size:18px;display:block;margin-bottom:2px}
.big span{color:var(--dim);font-size:13px;line-height:1.3}

/* Вкладки каталога */
.tabs{
  display:flex;
  gap:8px;
  background:var(--card);
  padding:6px;
  border-radius:16px;
  margin-bottom:16px;
  border:1px solid var(--line);
  overflow-x:auto;
}
.tab{
  flex:1;
  white-space:nowrap;
