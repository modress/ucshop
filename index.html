<!DOCTYPE html>
<html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KABAN UC</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0b0d12;--card:#161a23;--line:#252b38;--txt:#f4f5f7;--dim:#8b92a3;--acc:#ff9f1a;--acc2:#ff5e3a}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,Segoe UI,Roboto,sans-serif;padding:16px 16px 190px;min-height:100vh}
.scr{display:none;animation:in .25s}.scr.on{display:block}@keyframes in{from{opacity:0;transform:translateY(8px)}}
.hero{border-radius:24px;padding:26px 22px;margin-bottom:16px;background:linear-gradient(135deg,#ff9f1a,#ff5e3a 65%,#c1272d);position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-40px;top:-40px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.16)}
.hero small{opacity:.85;font-size:13px}.hero h1{font-size:26px;font-weight:900;margin-top:4px;line-height:1.15}.hero p{opacity:.92;margin-top:8px;font-size:14px}
.big{border-radius:22px;padding:20px;margin-bottom:12px;cursor:pointer;display:flex;align-items:center;gap:14px;border:1.5px solid var(--line);background:var(--card);transition:.15s}
.big:active{transform:scale(.97)}.big .ic{font-size:34px;width:60px;height:60px;border-radius:18px;display:grid;place-items:center}
.big b{font-size:18px;display:block}.big span{color:var(--dim);font-size:13px}
.big.uc .ic{background:linear-gradient(135deg,#ff9f1a,#ff5e3a)}.big.tg .ic{background:linear-gradient(135deg,#2aabee,#1c7bd8)}
.tabs{display:flex;gap:6px;background:var(--card);padding:5px;border-radius:16px;margin-bottom:14px;overflow-x:auto}
.tab{flex:1;white-space:nowrap;text-align:center;padding:11px 10px;border-radius:12px;font-size:14px;font-weight:700;color:var(--dim);cursor:pointer;transition:.2s}
.tab.on{background:linear-gradient(90deg,var(--acc),var(--acc2));color:#111}
h2{font-size:13px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;margin:6px 4px 12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pack{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:18px 14px;cursor:pointer;position:relative;transition:.15s}
.pack:active{transform:scale(.96)}.pack.sel{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 22%,transparent)}
.pack .t{font-size:19px;font-weight:800}.pack .p{color:var(--dim);margin-top:6px;font-size:14px}
.tag{position:absolute;top:-8px;right:10px;background:linear-gradient(90deg,var(--acc),var(--acc2));color:#111;font-size:10px;font-weight:800;padding:3px 8px;border-radius:8px}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:rgba(11,13,18,.92);backdrop-filter:blur(14px);border-top:1px solid var(--line);z-index:5}
.nav div{flex:1;text-align:center;font-size:11px;color:var(--dim);padding:6px;cursor:pointer;font-weight:600}.nav div i{display:block;font-style:normal;font-size:22px}
.nav div.on{color:var(--acc)}
.sheet{position:fixed;left:12px;right:12px;bottom:calc(70px + env(safe-area-inset-bottom));background:var(--card);border:1.5px solid var(--line);border-radius:22px;padding:14px;z-index:6;display:none;box-shadow:0 -10px 40px rgba(0,0,0,.5)}
.sheet.on{display:block;animation:in .2s}.sheet .nm{font-weight:800;margin-bottom:10px;font-size:15px}
input{width:100%;background:var(--bg);border:1.5px solid var(--line);border-radius:14px;color:var(--txt);font-size:16px;padding:14px;outline:none;margin-bottom:6px}input:focus{border-color:var(--acc)}
.err{color:#ff6b6b;font-size:12px;min-height:14px;margin-bottom:6px}
.btn{width:100%;border:0;border-radius:15px;padding:16px;font-size:16px;font-weight:800;color:#111;background:linear-gradient(90deg,var(--acc),var(--acc2));cursor:pointer}
.btn.alt{background:var(--card);color:var(--txt);border:1.5px solid var(--line);margin-top:10px}
.me{text-align:center;padding:10px 0 18px}.av{width:92px;height:92px;border-radius:50%;margin:0 auto 12px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;font-size:38px;font-weight:900;color:#111;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}.me h3{font-size:22px}.me span{color:var(--dim)}
.row{display:flex;justify-content:space-between;padding:15px 16px;background:var(--card);border-radius:14px;margin-bottom:8px}.row span{color:var(--dim)}
.note{color:var(--dim);font-size:13px;text-align:center;margin-top:14px;line-height:1.5}
</style></head><body>
 
<div class="scr on" id="home">
  <div class="hero"><small>👋 <span id="hi">Привет</span></small><h1>Добро пожаловать<br>в KABAN UC</h1><p>Быстрое пополнение UC для PUBG Mobile, звёзды и Premium для Telegram</p></div>
  <div class="big uc" onclick="openSec('uc')"><div class="ic">💎</div><div><b>PUBG Mobile</b><span>UC · Plus подписка · коды на UC</span></div></div>
  <div class="big tg" onclick="openSec('tg')"><div class="ic">⭐</div><div><b>Telegram</b><span>Звёзды · Premium</span></div></div>
  <div class="note">Оплата в боте: Stars или CryptoBot. Выдача — автоматически или в течение 15 минут.</div>
</div>
 
<div class="scr" id="sec"><h2 id="secname"></h2><div class="tabs" id="tabs"></div><div class="grid" id="grid"></div></div>
 
<div class="scr" id="prof">
  <div class="me"><div class="av" id="av"></div><h3 id="pn"></h3><span id="pu"></span></div>
  <div class="row"><span>ID</span><b id="pid2"></b></div>
  <button class="btn alt" onclick="deep('profile')">📋 Полный профиль в боте</button>
  <button class="btn alt" onclick="tg.openTelegramLink('https://t.me/neleron')">💬 Поддержка</button>
</div>
 
<div class="sheet" id="sheet"><div class="nm" id="snm"></div><input id="inp"><div class="err" id="err"></div><button class="btn" id="buy"></button></div>
 
<div class="nav">
  <div class="on" id="n-home" onclick="goHome()"><i>🏠</i>Главная</div>
  <div id="n-prof" onclick="goProf()"><i>👤</i>Профиль</div>
  <div onclick="tg.openTelegramLink('https://t.me/neleron')"><i>💬</i>Поддержка</div>
</div>
 
<script>
const tg=Telegram.WebApp;tg.ready();tg.expand();tg.setHeaderColor('#0b0d12');tg.setBackgroundColor('#0b0d12');
const BOT=new URLSearchParams(location.search).get('bot')||'';
const SECS={uc:{n:'💎 PUBG Mobile',acc:['#ff9f1a','#ff5e3a'],tabs:[['uc','Купить UC'],['plus','Plus подписка'],['codes','Код на UC']]},
            tg:{n:'⭐ Telegram',acc:['#2aabee','#1c7bd8'],tabs:[['stars','Звёзды'],['premium','Премиум']]}};
const NEED={uc:'pid',plus:'pid',codes:'none',stars:'user',premium:'user'};
let CAT=null,S='uc',T='uc',sel=null;
const $=id=>document.getElementById(id);
const user=(tg.initDataUnsafe||{}).user||{};
$('hi').textContent=user.first_name?('Привет, '+user.first_name+'!'):'Привет!';
 
function scr(id,nav){document.querySelectorAll('.scr').forEach(e=>e.classList.toggle('on',e.id==id));
  ['home','prof'].forEach(k=>$('n-'+k).classList.toggle('on',k==nav));
  $('sheet').classList.remove('on');sel=null;
  nav=='home'&&id=='home'?tg.BackButton.hide():tg.BackButton.show()}
function goHome(){scr('home','home');tg.BackButton.hide()}
tg.BackButton.onClick(goHome);
 
async function load(){if(CAT)return;try{CAT=await (await fetch('catalog.json?'+Date.now())).json()}catch(e){CAT={}}}
async function openSec(s,tab){await load();S=s;T=tab||SECS[s].tabs[0][0];
  const a=SECS[s].acc;document.documentElement.style.setProperty('--acc',a[0]);document.documentElement.style.setProperty('--acc2',a[1]);
  $('secname').textContent=SECS[s].n;scr('sec','home');tg.BackButton.show();draw()}
function draw(){sel=null;$('sheet').classList.remove('on');
  $('tabs').innerHTML=SECS[S].tabs.map(t=>`<div class="tab ${t[0]==T?'on':''}" onclick="T='${t[0]}';draw()">${t[1]}</div>`).join('');
  const items=CAT[T]||[];
  $('grid').innerHTML=items.length?items.map((p,i)=>`<div class="pack" id="p${i}" onclick="pick(${i})">${p.tag?`<div class="tag">${p.tag}</div>`:''}<div class="t">${p.title}</div><div class="p">${p.rub} ₽</div></div>`).join(''):'<div class="note">Товары пока не загружены</div>'}
function pick(i){sel=CAT[T][i];tg.HapticFeedback.impactOccurred('light');
  document.querySelectorAll('.pack').forEach((e,k)=>e.classList.toggle('sel',k==i));
  const n=NEED[T],inp=$('inp');$('err').textContent='';inp.value='';
  inp.style.display=n=='none'?'none':'block';
  inp.placeholder=n=='pid'?'Твой PUBG ID (8–12 цифр)':'@username получателя (пусто — себе)';
  inp.inputMode=n=='pid'?'numeric':'text';
  $('snm').textContent=sel.title;$('buy').textContent='Оплатить '+sel.rub+' ₽';$('sheet').classList.add('on')}
$('inp').oninput=e=>{if(NEED[T]=='pid')e.target.value=e.target.value.replace(/\D/g,'').slice(0,12);$('err').textContent=''};
$('buy').onclick=()=>{
  if(!BOT){$('err').textContent='Открой магазин через кнопку в боте';return}
  let t='x',n=NEED[T],v=$('inp').value.trim();
  if(n=='pid'){if(v.length<8){$('err').textContent='Введи корректный PUBG ID';return}t=v}
  if(n=='user'){v=v.replace('@','');if(!v)t='me';else if(/^[A-Za-z0-9_]{4,32}$/.test(v))t=v;else{$('err').textContent='Неверный username';return}}
  deep('b_'+sel.id+'_'+t)};
function deep(p){tg.openTelegramLink('https://t.me/'+BOT+'?start='+p);setTimeout(()=>tg.close(),300)}
 
function goProf(){const n=(user.first_name||'')+' '+(user.last_name||'');$('pn').textContent=n.trim()||'Гость';
  $('pu').textContent=user.username?'@'+user.username:'без юзернейма';$('pid2').textContent=user.id||'—';
  $('av').innerHTML=user.photo_url?`<img src="${user.photo_url}">`:(n.trim()[0]||'?');scr('prof','prof')}
 
const start=new URLSearchParams(location.search).get('s');if(SECS[start])openSec(start);
</script></body></html>
